# 密钥不再写入版本库，统一由环境变量注入：
#   openai_config.api_key  <- STREAMING_AVA_OPENAI_API_KEY
#   bigmodel_config.api_key <- STREAMING_AVA_BIGMODEL_API_KEY
openai_config:
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ""                 # 由 STREAMING_AVA_OPENAI_API_KEY 注入
  model: "qwen-plus"
  multimodal_model: "qwen3.5-omni-flash"
  timeout: 60

bigmodel_config:
  api_base: "https://open.bigmodel.cn/api/paas/v4"
  api_key: ""                 # 由 STREAMING_AVA_BIGMODEL_API_KEY 注入
  model: "glm-4.6v-flash"
  timeout: 15
  enabled: false