# 密钥不再写入版本库，统一由环境变量注入：
#   cosyvoice.api_key <- STREAMING_AVA_TTS_API_KEY
#   step_fun.api_key  <- STREAMING_AVA_STEPFUN_API_KEY
#   dou_bao.x_api_key <- STREAMING_AVA_DOUBAO_X_API_KEY
voice_config:
  provider: "dou_bao" # cosyvoice / step_fun / dou_bao
  volume: 50
  speech_rate: 1.0
  pitch_rate: 1.0
  format: "wav"
  sample_rate: 24000
  timeout: 1200
  cosyvoice:
    api_base: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
    api_key: ""                 # 由 STREAMING_AVA_TTS_API_KEY 注入
    model: "cosyvoice-v3-flash"
    voice: "longanhuan"
    instruction: "你说话的角色是温和客服，你说话的情感是neutral。"
  step_fun:
    api_key: ""                 # 由 STREAMING_AVA_STEPFUN_API_KEY 注入
    ws_url: "wss://api.stepfun.com/v1/realtime/audio"
    model: "stepaudio-2.5-tts"
    voice: "cixingnansheng"
    instruction: "你说话的角色是温和客服，你说话的情感是neutral。"
  dou_bao:
    x_api_key: ""               # 由 STREAMING_AVA_DOUBAO_X_API_KEY 注入
    x_api_resource_id: "seed-tts-2.0"
    req_params:
      model: "seed-tts-2.0-standard"
      speaker: "saturn_zh_male_shuanglangshaonian_tob"
      audio_params:
        format: "pcm"
        sample_rate: 24000
        speech_rate: 0
        loudness_rate: 0
      additions:
        disable_markdown_filter: true
        enable_latex_tn: true
        latex_parser: true
        context_texts:
          - "嗯，你的语气再欢乐一点"
    ws_url: "wss://openspeech.bytedance.com/api/v3/tts/bidirection"
    sse_url: "https://openspeech.bytedance.com/api/v3/tts/unidirectional/sse"

